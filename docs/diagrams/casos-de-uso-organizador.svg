<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1150" viewBox="0 0 1500 1150" role="img" aria-labelledby="title desc">
  <title id="title">Casos de uso do Organizador</title>
  <desc id="desc">Diagrama UML das funcionalidades disponíveis para organizadores no ConectaFreela.</desc>
