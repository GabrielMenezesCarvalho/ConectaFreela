<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1190" viewBox="0 0 1600 1190" role="img" aria-labelledby="title description">
  <title id="title">Diagrama de casos de uso do ConectaFreela</title>
  <desc id="description">Casos de uso organizados por ator: Talento em verde, Organizador em rosa e Administrador em vermelho.</desc>

  <defs>
    <linearGradient id="sharedGradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#008f5a" />
      <stop offset="100%" stop-color="#db2777" />
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#0f172a" flood-opacity="0.12" />
    </filter>
  </defs>

  <rect width="1600" height="1190" fill="#f8fafc" />
  <rect x="190" y="180" width="1220" height="950" rx="28" fill="#ffffff" stroke="#334155" stroke-width="3" />

  <rect x="220" y="195" width="220" height="48" rx="24" fill="#006b44" />
  <text x="330" y="226" text-anchor="middle" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700">ConectaFreela</text>

  <!-- Faixas visuais por perfil -->
  <rect x="220" y="290" width="430" height="650" rx="24" fill="#008f5a" opacity="0.055" />
  <rect x="950" y="290" width="430" height="760" rx="24" fill="#db2777" opacity="0.055" />
  <rect x="540" y="195" width="520" height="105" rx="24" fill="#dc2626" opacity="0.05" />

  <text x="435" y="310" text-anchor="middle" fill="#006b44" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" letter-spacing="1.5">TALENTO</text>
  <text x="1165" y="310" text-anchor="middle" fill="#9d174d" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" letter-spacing="1.5">ORGANIZADOR</text>

  <!-- Associações do administrador -->
  <g fill="none" stroke="#dc2626" stroke-width="3" stroke-linecap="round" opacity="0.55">
    <path d="M770 138 L620 207" />
    <path d="M830 138 L980 207" />
  </g>

  <!-- Associações do talento, roteadas na lateral da faixa -->
  <g fill="none" stroke="#008f5a" stroke-width="3" stroke-linecap="round" opacity="0.55">
    <path d="M155 610 L245 365" />
    <path d="M155 610 L245 490" />
    <path d="M155 610 L245 615" />
    <path d="M155 610 L245 740" />
    <path d="M155 610 L245 865" />
    <path d="M155 610 H205 V1060 H620" />
  </g>

  <!-- Associações do organizador, roteadas na lateral da faixa -->
  <g fill="none" stroke="#db2777" stroke-width="3" stroke-linecap="round" opacity="0.55">
    <path d="M1445 610 L1355 365" />
    <path d="M1445 610 L1355 470" />
    <path d="M1445 610 L1355 575" />
    <path d="M1445 610 L1355 680" />
    <path d="M1445 610 L1355 785" />
    <path d="M1445 610 L1355 890" />
    <path d="M1445 610 L1355 995" />
    <path d="M1445 610 H1395 V1060 H980" />
  </g>

  <!-- Integração externa -->
  <path d="M1355 890 H1435" fill="none" stroke="#dc2626" stroke-width="3" stroke-dasharray="9 7" />

  <!-- Casos de uso do administrador -->
  <g font-family="Inter, Arial, sans-serif" font-size="18" font-weight="650" text-anchor="middle" fill="#ffffff" filter="url(#softShadow)">
    <ellipse cx="620" cy="250" rx="155" ry="43" fill="#dc2626" stroke="#991b1b" stroke-width="3" />
    <text x="620" y="256">Entrar como administrador</text>

    <ellipse cx="980" cy="250" rx="155" ry="43" fill="#dc2626" stroke="#991b1b" stroke-width="3" />
    <text x="980" y="246">Consultar métricas</text>
    <text x="980" y="268">da plataforma</text>
  </g>

  <!-- Casos de uso do talento -->
  <g font-family="Inter, Arial, sans-serif" font-size="18" font-weight="650" text-anchor="middle" fill="#ffffff" filter="url(#softShadow)">
    <ellipse cx="420" cy="365" rx="175" ry="45" fill="#008f5a" stroke="#006b44" stroke-width="3" />
    <text x="420" y="371">Criar conta e entrar</text>

    <ellipse cx="420" cy="490" rx="175" ry="45" fill="#008f5a" stroke="#006b44" stroke-width="3" />
    <text x="420" y="486">Gerenciar perfil</text>
    <text x="420" y="508">profissional</text>

    <ellipse cx="420" cy="615" rx="175" ry="45" fill="#008f5a" stroke="#006b44" stroke-width="3" />
    <text x="420" y="621">Buscar oportunidades</text>

    <ellipse cx="420" cy="740" rx="175" ry="45" fill="#008f5a" stroke="#006b44" stroke-width="3" />
    <text x="420" y="736">Enviar ou retirar</text>
    <text x="420" y="758">candidatura</text>

    <ellipse cx="420" cy="865" rx="175" ry="45" fill="#008f5a" stroke="#006b44" stroke-width="3" />
    <text x="420" y="861">Acompanhar status</text>
    <text x="420" y="883">da candidatura</text>
  </g>

  <!-- Casos de uso do organizador -->
  <g font-family="Inter, Arial, sans-serif" font-size="18" font-weight="650" text-anchor="middle" fill="#ffffff" filter="url(#softShadow)">
    <ellipse cx="1180" cy="365" rx="175" ry="45" fill="#db2777" stroke="#9d174d" stroke-width="3" />
    <text x="1180" y="371">Criar conta e entrar</text>

    <ellipse cx="1180" cy="470" rx="175" ry="45" fill="#db2777" stroke="#9d174d" stroke-width="3" />
    <text x="1180" y="466">Gerenciar perfil</text>
    <text x="1180" y="488">da organização</text>

    <ellipse cx="1180" cy="575" rx="175" ry="45" fill="#db2777" stroke="#9d174d" stroke-width="3" />
    <text x="1180" y="581">Publicar oportunidade</text>

    <ellipse cx="1180" cy="680" rx="175" ry="45" fill="#db2777" stroke="#9d174d" stroke-width="3" />
    <text x="1180" y="686">Analisar candidaturas</text>

    <ellipse cx="1180" cy="785" rx="175" ry="45" fill="#db2777" stroke="#9d174d" stroke-width="3" />
    <text x="1180" y="791">Liberar conversa</text>

    <ellipse cx="1180" cy="890" rx="175" ry="45" fill="#db2777" stroke="#9d174d" stroke-width="3" />
    <text x="1180" y="896">Assinar Premium</text>

    <ellipse cx="1180" cy="995" rx="175" ry="45" fill="#db2777" stroke="#9d174d" stroke-width="3" />
    <text x="1180" y="1001">Destacar oportunidade</text>
  </g>

  <!-- Caso de uso compartilhado -->
  <g font-family="Inter, Arial, sans-serif" font-size="19" font-weight="700" text-anchor="middle" fill="#ffffff" filter="url(#softShadow)">
    <ellipse cx="800" cy="1060" rx="180" ry="48" fill="url(#sharedGradient)" stroke="#334155" stroke-width="3" />
    <text x="800" y="1066">Trocar mensagens</text>
  </g>

  <!-- Ator: Administrador -->
  <g fill="none" stroke="#dc2626" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="800" cy="35" r="23" fill="#fee2e2" />
    <path d="M800 58 V105 M765 78 H835 M800 105 L770 138 M800 105 L830 138" />
  </g>
  <text x="885" y="92" text-anchor="start" fill="#991b1b" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="750">Administrador</text>

  <!-- Ator: Talento -->
  <g fill="none" stroke="#008f5a" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="90" cy="535" r="27" fill="#d1fae5" />
    <path d="M90 562 V630 M48 593 H132 M90 630 L52 680 M90 630 L128 680" />
  </g>
  <text x="90" y="717" text-anchor="middle" fill="#006b44" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="750">Talento</text>

  <!-- Ator: Organizador -->
  <g fill="none" stroke="#db2777" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="1510" cy="535" r="27" fill="#fce7f3" />
    <path d="M1510 562 V630 M1468 593 H1552 M1510 630 L1472 680 M1510 630 L1548 680" />
  </g>
  <text x="1510" y="717" text-anchor="middle" fill="#9d174d" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="750">Organizador</text>

  <!-- Sistema externo -->
  <rect x="1435" y="840" width="150" height="100" rx="16" fill="#dc2626" stroke="#991b1b" stroke-width="3" filter="url(#softShadow)" />
  <text x="1510" y="880" text-anchor="middle" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="650">Sistema externo</text>
  <text x="1510" y="912" text-anchor="middle" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="750">AbacatePay</text>
</svg>
