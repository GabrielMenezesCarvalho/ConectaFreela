    <ellipse cx="460" cy="320" rx="185" ry="45" fill="#db2777" stroke="#9d174d" stroke-width="3" /><text x="460" y="326">Gerar pagamento PIX</text>
    <ellipse cx="460" cy="460" rx="185" ry="45" fill="#db2777" stroke="#9d174d" stroke-width="3" /><text x="460" y="466">Consultar pagamento</text>
    <ellipse cx="460" cy="740" rx="185" ry="45" fill="#db2777" stroke="#9d174d" stroke-width="3" /><text x="460" y="746">Destacar oportunidade</text>

    <ellipse cx="920" cy="320" rx="185" ry="45" fill="#dc2626" stroke="#991b1b" stroke-width="3" /><text x="920" y="326">Criar cobrança externa</text>
    <ellipse cx="920" cy="460" rx="185" ry="45" fill="#dc2626" stroke="#991b1b" stroke-width="3" /><text x="920" y="466">Consultar status externo</text>
    <ellipse cx="920" cy="590" rx="185" ry="45" fill="#dc2626" stroke="#991b1b" stroke-width="3" /><text x="920" y="586">Simular pagamento</text><text x="920" y="609">no sandbox</text>

    <ellipse cx="460" cy="590" rx="185" ry="45" fill="#008f5a" stroke="#006b44" stroke-width="3" /><text x="460" y="586">Ativar ou renovar</text><text x="460" y="609">assinatura</text>
    <ellipse cx="690" cy="850" rx="185" ry="45" fill="#008f5a" stroke="#006b44" stroke-width="3" /><text x="690" y="846">Validar e consumir</text><text x="690" y="869">um crédito</text>
    <ellipse cx="920" cy="740" rx="185" ry="45" fill="#008f5a" stroke="#006b44" stroke-width="3" /><text x="920" y="736">Adicionar três créditos</text><text x="920" y="759">de destaque</text>
  </g>

  <g fill="none" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="9 7" marker-end="url(#arrow)">
