  <g fill="none" stroke="#db2777" stroke-width="3" opacity="0.58"><path d="M1295 470 L880 320" /><path d="M1295 470 L880 450" /><path d="M1295 470 L880 580" /><path d="M1295 470 L880 710" /><path d="M1295 470 L1125 165" /><path d="M1295 470 L1125 255" /></g>

