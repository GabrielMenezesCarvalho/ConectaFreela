<svg xmlns="http://www.w3.org/2000/svg" width="1450" height="960" viewBox="0 0 1450 960" role="img" aria-labelledby="title desc">
  <title id="title">Casos de uso da Comunicação</title>
  <desc id="desc">Diagrama UML da abertura de conversas, mensagens e indicadores de não lidas.</desc>
  <defs>
    <linearGradient id="shared" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#008f5a" /><stop offset="100%" stop-color="#db2777" /></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.12" /></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#dc2626" stroke-width="1.8" /></marker>
  </defs>
  <rect width="1450" height="960" fill="#f8fafc" />
  <rect x="190" y="50" width="1070" height="860" rx="28" fill="#ffffff" stroke="#334155" stroke-width="3" />
