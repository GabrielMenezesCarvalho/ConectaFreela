    <ellipse cx="950" cy="165" rx="175" ry="42" fill="#db2777" stroke="#9d174d" stroke-width="3" /><text x="950" y="171">Analisar candidatura</text>
    <ellipse cx="950" cy="255" rx="175" ry="42" fill="#db2777" stroke="#9d174d" stroke-width="3" /><text x="950" y="261">Liberar conversa</text>
    <ellipse cx="700" cy="320" rx="180" ry="45" fill="url(#shared)" stroke="#334155" stroke-width="3" /><text x="700" y="326">Listar conversas</text>
    <ellipse cx="700" cy="450" rx="180" ry="45" fill="url(#shared)" stroke="#334155" stroke-width="3" /><text x="700" y="456">Abrir conversa</text>
    <ellipse cx="700" cy="580" rx="180" ry="45" fill="url(#shared)" stroke="#334155" stroke-width="3" /><text x="700" y="586">Enviar mensagem</text>
    <ellipse cx="700" cy="710" rx="180" ry="45" fill="url(#shared)" stroke="#334155" stroke-width="3" /><text x="700" y="706">Consultar mensagens</text><text x="700" y="729">não lidas</text>
    <ellipse cx="475" cy="845" rx="175" ry="42" fill="#dc2626" stroke="#991b1b" stroke-width="3" /><text x="475" y="851">Validar participante</text>
    <ellipse cx="925" cy="845" rx="175" ry="42" fill="#dc2626" stroke="#991b1b" stroke-width="3" /><text x="925" y="841">Marcar recebidas</text><text x="925" y="864">como lidas</text>
  </g>

  <g fill="none" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="9 7" marker-end="url(#arrow)">
    <path d="M950 213 V207" /><path d="M620 490 H475 V803" /><path d="M620 600 H520 V803" /><path d="M780 490 H925 V803" />
