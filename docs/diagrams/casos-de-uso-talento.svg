<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000" role="img" aria-labelledby="title desc">
  <title id="title">Casos de uso do Talento</title>
  <desc id="desc">Diagrama UML das funcionalidades disponíveis para talentos no ConectaFreela.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.12" /></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#dc2626" stroke-width="1.8" /></marker>
  </defs>
  <rect width="1400" height="1000" fill="#f8fafc" />
  <rect x="190" y="50" width="1150" height="900" rx="28" fill="#ffffff" stroke="#334155" stroke-width="3" />
  <rect x="220" y="75" width="325" height="50" rx="25" fill="#008f5a" />
  <text x="382" y="108" text-anchor="middle" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="700">Casos de uso — Talento</text>

  <g fill="none" stroke="#008f5a" stroke-width="3" stroke-linecap="round" opacity="0.58">
    <path d="M155 500 L275 160" /><path d="M155 500 L275 275" /><path d="M155 500 L275 390" />
    <path d="M155 500 L275 505" /><path d="M155 500 L275 620" /><path d="M155 500 L275 735" /><path d="M155 500 L275 850" />
  </g>

  <g font-family="Inter, Arial, sans-serif" font-size="19" font-weight="650" text-anchor="middle" fill="#ffffff" filter="url(#shadow)">
    <ellipse cx="450" cy="160" rx="175" ry="45" fill="#008f5a" stroke="#006b44" stroke-width="3" /><text x="450" y="166">Criar conta e entrar</text>
    <ellipse cx="450" cy="275" rx="175" ry="45" fill="#008f5a" stroke="#006b44" stroke-width="3" /><text x="450" y="271">Gerenciar perfil</text><text x="450" y="294">profissional</text>
    <ellipse cx="450" cy="390" rx="175" ry="45" fill="#008f5a" stroke="#006b44" stroke-width="3" /><text x="450" y="396">Explorar oportunidades</text>
    <ellipse cx="450" cy="505" rx="175" ry="45" fill="#008f5a" stroke="#006b44" stroke-width="3" /><text x="450" y="511">Consultar detalhes</text>
    <ellipse cx="450" cy="620" rx="175" ry="45" fill="#008f5a" stroke="#006b44" stroke-width="3" /><text x="450" y="626">Enviar candidatura</text>
    <ellipse cx="450" cy="735" rx="175" ry="45" fill="#008f5a" stroke="#006b44" stroke-width="3" /><text x="450" y="731">Acompanhar status</text><text x="450" y="754">da candidatura</text>
    <ellipse cx="450" cy="850" rx="175" ry="45" fill="#008f5a" stroke="#006b44" stroke-width="3" /><text x="450" y="856">Trocar mensagens</text>
  </g>

  <g font-family="Inter, Arial, sans-serif" font-size="18" font-weight="650" text-anchor="middle" fill="#ffffff" filter="url(#shadow)">
    <ellipse cx="1000" cy="390" rx="175" ry="45" fill="#db2777" stroke="#9d174d" stroke-width="3" /><text x="1000" y="386">Priorizar destaques</text><text x="1000" y="409">compatíveis</text>
    <ellipse cx="1000" cy="735" rx="175" ry="45" fill="#dc2626" stroke="#991b1b" stroke-width="3" /><text x="1000" y="731">Retirar candidatura</text><text x="1000" y="754">em análise</text>
    <ellipse cx="1000" cy="850" rx="175" ry="45" fill="#db2777" stroke="#9d174d" stroke-width="3" /><text x="1000" y="846">Consultar mensagens</text><text x="1000" y="869">não lidas</text>
  </g>

  <g fill="none" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="9 7" marker-end="url(#arrow)">
    <path d="M825 390 H630" /><path d="M825 735 H630" /><path d="M825 850 H630" />
    <path d="M630 620 H705 V505 H630" />
  </g>
  <g font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" fill="#991b1b" text-anchor="middle">
    <text x="728" y="375">«extend»</text><text x="728" y="720">«extend»</text><text x="728" y="835">«extend»</text><text x="748" y="570">«include»</text>
  </g>

  <g fill="none" stroke="#008f5a" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="90" cy="415" r="27" fill="#d1fae5" /><path d="M90 442 V510 M48 473 H132 M90 510 L52 560 M90 510 L128 560" />
  </g>
  <text x="90" y="600" text-anchor="middle" fill="#006b44" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="750">Talento</text>
  <text x="1030" y="920" text-anchor="middle" fill="#64748b" font-family="Inter, Arial, sans-serif" font-size="15">Rosa e vermelho indicam comportamentos condicionais.</text>
</svg>
