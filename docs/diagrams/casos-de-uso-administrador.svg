<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="820" viewBox="0 0 1300 820" role="img" aria-labelledby="title desc">
  <title id="title">Casos de uso do Administrador</title>
  <desc id="desc">Diagrama UML das métricas administrativas do ConectaFreela.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.12" /></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#dc2626" stroke-width="1.8" /></marker>
  </defs>
  <rect width="1300" height="820" fill="#f8fafc" />
  <rect x="190" y="50" width="1060" height="720" rx="28" fill="#ffffff" stroke="#334155" stroke-width="3" />
  <rect x="220" y="75" width="380" height="50" rx="25" fill="#dc2626" /><text x="410" y="108" text-anchor="middle" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="700">Casos de uso — Administrador</text>

  <g fill="none" stroke="#dc2626" stroke-width="3" opacity="0.58"><path d="M155 390 L300 170" /><path d="M155 390 L300 300" /></g>
  <g font-family="Inter, Arial, sans-serif" font-size="19" font-weight="650" text-anchor="middle" fill="#ffffff" filter="url(#shadow)">
    <ellipse cx="470" cy="170" rx="170" ry="45" fill="#dc2626" stroke="#991b1b" stroke-width="3" /><text x="470" y="176">Entrar como administrador</text>
    <ellipse cx="470" cy="300" rx="170" ry="45" fill="#dc2626" stroke="#991b1b" stroke-width="3" /><text x="470" y="306">Consultar dashboard</text>
  </g>
  <g font-family="Inter, Arial, sans-serif" font-size="17" font-weight="650" text-anchor="middle" fill="#ffffff" filter="url(#shadow)">
    <ellipse cx="860" cy="170" rx="160" ry="42" fill="#008f5a" stroke="#006b44" stroke-width="3" /><text x="860" y="176">Totais da plataforma</text>
    <ellipse cx="860" cy="280" rx="160" ry="42" fill="#008f5a" stroke="#006b44" stroke-width="3" /><text x="860" y="276">Ativação e aprovação</text><text x="860" y="298">de candidaturas</text>
    <ellipse cx="860" cy="390" rx="160" ry="42" fill="#db2777" stroke="#9d174d" stroke-width="3" /><text x="860" y="386">Conversão e retenção</text><text x="860" y="408">Premium</text>
