    <ellipse cx="860" cy="610" rx="160" ry="42" fill="#dc2626" stroke="#991b1b" stroke-width="3" /><text x="860" y="606">Pagamentos e adoção</text><text x="860" y="628">de destaques</text>
  </g>

  <g fill="none" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="9 7" marker-end="url(#arrow)">
    <path d="M600 300 H650 V170 H700" /><path d="M600 300 H700" /><path d="M600 300 H650 V390 H700" /><path d="M600 300 H635 V500 H700" /><path d="M600 300 H620 V610 H700" />
  </g>
  <g font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#991b1b">
    <text x="652" y="155">«include»</text><text x="640" y="285">«include»</text><text x="652" y="375">«include»</text><text x="637" y="485">«include»</text><text x="622" y="595">«include»</text>
  </g>

  <g fill="none" stroke="#dc2626" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"><circle cx="90" cy="305" r="27" fill="#fee2e2" /><path d="M90 332 V400 M48 363 H132 M90 400 L52 450 M90 400 L128 450" /></g>
  <text x="90" y="490" text-anchor="middle" fill="#991b1b" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="750">Administrador</text>
